name: production backup health
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a verified backup less than 75 minutes old
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 10 https://chinese-study-beta-swimj.fly.dev/backup-healthz)
          printf '%s' "$response" | python3 -c 'import json,sys; v=json.load(sys.stdin); age=v.get("ageSeconds"); assert v.get("status")=="ok" and isinstance(age,(int,float)) and 0 <= age <= 4500, "Backup is unknown or stale"'

