app = "REPLACE_WITH_APP_NAME"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  # This template is copied to deploy/fly/.generated/fly.toml before use.
  dockerfile = "../../../deploy/fly/Dockerfile"

[build.args]
  VITE_CLERK_PUBLISHABLE_KEY = "REPLACE_WITH_CLERK_PUBLISHABLE_KEY"
  # APP_REVISION is supplied at deploy time by hosted:upgrade:
  #   fly deploy --build-arg APP_REVISION=<full-git-sha>
  # Do not put a placeholder revision here.

[env]
  APP_AUTH_MODE = "clerk"
  APP_DATA_DIR = "/data"
  APP_MODE = "study"
  APP_METRICS_PORT = "9091"
  APP_STUDY_PROFILE = "mandarin"
  APP_USE_LOCAL_PROVIDER_PROXY = "false"
  CLERK_PUBLISHABLE_KEY = "REPLACE_WITH_CLERK_PUBLISHABLE_KEY"
  CLERK_AUTHORIZED_PARTY = "https://REPLACE_WITH_APP_NAME.fly.dev"
  LITESTREAM_BUCKET = "REPLACE_WITH_VERSIONED_BACKUP_BUCKET"
  LITESTREAM_REGION = "ap-southeast-1"
  PORT = "5174"
  # Hosted app-only upgrade smoke identity. Prefer the Clerk user_ id; the
  # email is only a resolver for that id. Do not put a password here.
  # APP_SMOKE_CLERK_USER_ID = "user_REPLACE_ME"
  # APP_SMOKE_CLERK_EMAIL = "REPLACE_WITH_SMOKE_EMAIL"

[mounts]
  source = "app_data"
  destination = "/data"

[http_service]
  internal_port = 5174
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "45s"
    method = "GET"
    path = "/healthz"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
