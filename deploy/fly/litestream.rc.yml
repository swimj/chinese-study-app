logging:
  level: info
  type: json
  stderr: true

shutdown-sync-timeout: 30s
shutdown-sync-interval: 500ms

socket:
  enabled: true
  path: /data/litestream.sock
  permissions: 0600

snapshot:
  interval: 1h
  retention: 168h

dbs:
  - path: /data/app.db
    restore-if-db-not-exists: false
    monitor-interval: 1s
    checkpoint-interval: 1m
    busy-timeout: 5s
    replica:
      url: s3://${LITESTREAM_BUCKET}/${LITESTREAM_REPLICA_PATH}
      region: ${LITESTREAM_REGION}
      sync-interval: 1s
