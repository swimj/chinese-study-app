<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Where session state lives</title><desc id="desc">Browser view and volatile command queue communicate with a derived server cache. SQLite owns immutable session repertoire, append-only events and completion records. Cold cache loads and replays persisted state once.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#50677c"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19334a}.heading{font-size:31px;font-weight:700}.sub{font-size:19px;fill:#50677c}.cardtitle{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#50677c}.label{font-size:18px;font-weight:700}</style><rect width="1200" height="840" fill="#f5f8fb"/><text x="48" y="62" class="heading">Where session state lives</text><text x="48" y="96" class="sub">The server runs the player; SQLite retains the recoverable session.</text>
<rect x="48" y="155" width="322" height="243" rx="16" fill="#e6f1fb" stroke="#b7c9d8"/>
<text x="70" y="191" class="cardtitle">Browser</text>
<text x="70" y="228" class="body">Current study view</text>
<text x="70" y="257" class="body">Ordered command queue</text>
<text x="70" y="286" class="body">Queue is volatile</text>
<text x="70" y="315" class="body">Responses refresh the view</text>
<rect x="438" y="155" width="324" height="243" rx="16" fill="#e6f1fb" stroke="#b7c9d8"/>
<text x="460" y="191" class="cardtitle">Server player</text>
<text x="460" y="228" class="body">Derived runtime cache</text>
<text x="460" y="257" class="body">Connection + learner + session</text>
<text x="460" y="286" class="body">64-session LRU limit</text>
<text x="460" y="315" class="body">Frozen repertoire + projection</text>
<rect x="830" y="155" width="322" height="243" rx="16" fill="#e8f3eb" stroke="#b7c9d8"/>
<text x="852" y="191" class="cardtitle">SQLite</text>
<text x="852" y="228" class="body">Immutable session payload</text>
<text x="852" y="257" class="body">Append-only action log</text>
<text x="852" y="286" class="body">Encounter evidence</text>
<text x="852" y="315" class="body">Completion records</text>
<path d="M370,246 L438,246" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M830,306 L762,306" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="391" y="225" class="small">send</text>
<text x="778" y="286" class="small">read</text>
<path d="M600,398 L600,446 L990,446 L990,398" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="687" y="435" class="small">Transactional evidence writes</text>
<path d="M600,155 L600,130 L210,130 L210,155" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="505" width="535" height="160" rx="16" fill="#fff3d8" stroke="#b7c9d8"/>
<text x="70" y="541" class="cardtitle">What survives a restart?</text>
<text x="70" y="578" class="body">SQLite payload, log and completion records.</text>
<text x="70" y="607" class="body">Cache is rebuilt from these records;</text>
<text x="70" y="636" class="body">browser unsaved commands are not durable.</text>
<rect x="617" y="505" width="535" height="160" rx="16" fill="#e8f3eb" stroke="#b7c9d8"/>
<text x="639" y="541" class="cardtitle">What is frozen?</text>
<text x="639" y="578" class="body">Admitted words, starting states, content versions,</text>
<text x="639" y="607" class="body">reveal material and pools for supported modes.</text>
<text x="639" y="636" class="body">The order of encounters remains dynamic.</text>
<text x="48" y="720" class="label">Cold cache / eviction: load the retained payload and log, then replay once.</text>
<text x="48" y="758" class="small">Access is still checked. Current-word personal notes are read separately.</text>
<text x="48" y="792" class="small">Derived cache state is never the durable source of truth.</text></svg>
