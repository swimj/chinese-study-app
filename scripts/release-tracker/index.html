<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Tracker</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1f2328; --muted: #646a73; --line: #e3e1dc;
    --ok: #1a7f37; --ok-bg: #e6f4ea; --run: #8a5a00; --run-bg: #fff4d6;
    --fail: #b42318; --fail-bg: #fde8e7; --skip: #646a73; --skip-bg: #eeede9;
    --wait: #2f5fb3; --wait-bg: #e7eefb; --accent: #2f5fb3; --select: #eef2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1d2024; --text: #e6e6e3; --muted: #9aa0a8; --line: #2e3238;
      --ok: #4ac26b; --ok-bg: #16301e; --run: #e3b341; --run-bg: #33290f;
      --fail: #ff7b72; --fail-bg: #3a1a19; --skip: #9aa0a8; --skip-bg: #26292e;
      --wait: #79a6f2; --wait-bg: #1b2740; --accent: #79a6f2; --select: #1f2a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  nav { border-right: 1px solid var(--line); padding: 20px 12px; background: var(--panel); }
  @media (max-width: 900px) { nav { border-right: 0; border-bottom: 1px solid var(--line); } }
  nav h1 { font-size: 15px; margin: 0 4px 12px; }
  .release { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
    padding: 8px; color: inherit; font: inherit; cursor: pointer; }
  .release:hover, .release:focus-visible { background: var(--select); outline: none; }
  .release[aria-current="true"] { background: var(--select); }
  .release .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .release .name { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .release .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  main { padding: 24px 16px 48px; max-width: 1100px; width: 100%; }
  header h2 { font-size: 22px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .phase { font-size: 16px; color: var(--accent); margin: 4px 0 2px; font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; margin-top: 20px; }
  @media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  section + section { margin-top: 16px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .group + .group { margin-top: 14px; }
  .group-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .stage { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: start;
    padding: 6px 0; border-top: 1px solid var(--line); }
  .group-title + .stage { border-top: 0; }
  .pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; text-align: center; white-space: nowrap; }
  .pending { color: var(--muted); border: 1px solid var(--line); }
  .running, .in-progress { color: var(--run); background: var(--run-bg); }
  .ok, .released { color: var(--ok); background: var(--ok-bg); }
  .failed { color: var(--fail); background: var(--fail-bg); }
  .skipped, .abandoned { color: var(--skip); background: var(--skip-bg); }
  .waiting { color: var(--wait); background: var(--wait-bg); }
  .running .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    margin-right: 4px; vertical-align: middle; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .label { overflow-wrap: anywhere; }
  .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin-top: 2px; }
  .dur { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  dl { margin: 0; display: grid; grid-template-columns: minmax(90px, auto) minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .notes { list-style: none; margin: 0; padding: 0; }
  .notes li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
  .notes li:first-child { border-top: 0; }
  .notes time { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; }
  .stale { color: var(--fail); }
</style>
</head>
<body>
<div class="layout">
  <nav aria-label="Releases">
    <h1>Releases</h1>
    <div id="releases"><p class="empty">Loading…</p></div>
  </nav>
  <main id="main">
    <p class="empty">No releases recorded yet.</p>
  </main>
</div>
<script>
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtDate = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function seconds(a, b) { return Math.max(0, Math.round((Date.parse(b) - Date.parse(a)) / 1000)); }
function fmtDuration(s) { return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
let releases = [];
let current = null;
let selected = decodeURIComponent(location.hash.slice(1)) || null;

function renderList() {
  const box = document.getElementById('releases'); box.replaceChildren();
  if (!releases.length) { box.append(el('p', 'empty', 'None yet')); return; }
  for (const r of releases) {
    const b = el('button', 'release'); b.type = 'button';
    b.setAttribute('aria-current', String(r.id === selected));
    const row = el('div', 'row');
    row.append(el('span', 'name', r.title), el('span', `pill ${r.outcome}`, r.outcome));
    b.append(row, el('div', 'sub', `${fmtDate(r.createdAt)} · ${r.mode} · ${(r.commit || '').slice(0, 7)}`));
    b.addEventListener('click', () => { location.hash = r.id; });
    box.append(b);
  }
}

function renderRelease(s) {
  const main = document.getElementById('main'); main.replaceChildren();
  const header = el('header');
  header.append(el('h2', null, s.title), el('div', 'phase', s.phase || '—'));
  const live = s.outcome === 'in-progress';
  const age = (Date.now() - Date.parse(s.updatedAt)) / 1000;
  const meta = el('div', 'meta' + (live && age > 600 ? ' stale' : ''),
    `${s.mode} release · ${s.commit ? s.commit.slice(0, 12) : 'commit not recorded'} · started ${fmtDate(s.createdAt)} · `
    + (live ? `updated ${fmtTime(s.updatedAt)}${age > 600 ? ' · no update for over 10 minutes' : ''}` : `${s.outcome} after ${fmtDuration(seconds(s.createdAt, s.updatedAt))}`));
  header.append(meta);
  const grid = el('div', 'grid');
  const stages = el('section'); stages.append(el('h3', null, 'Stages'));
  for (const g of s.plan || []) {
    const group = el('div', 'group'); group.append(el('div', 'group-title', g.group));
    for (const item of g.stages) {
      const st = s.stages[item.id] || { status: 'pending' };
      const row = el('div', 'stage');
      const pill = el('span', `pill ${st.status}`);
      if (st.status === 'running') pill.append(el('span', 'dot'));
      pill.append(document.createTextNode(st.status));
      const body = el('div'); body.append(el('div', 'label', item.label));
      if (st.detail) body.append(el('div', 'detail', st.detail));
      const end = st.endedAt || (st.status === 'running' ? new Date().toISOString() : null);
      row.append(pill, body, el('span', 'dur', st.startedAt && end ? fmtDuration(seconds(st.startedAt, end)) : ''));
      group.append(row);
    }
    stages.append(group);
  }
  const side = el('div');
  const facts = el('section'); facts.append(el('h3', null, 'Key facts'));
  const dl = el('dl'); const entries = Object.entries(s.facts || {});
  if (!entries.length) dl.append(el('dd', 'empty', 'None yet'));
  for (const [k, v] of entries) dl.append(el('dt', null, k), el('dd', null, v));
  facts.append(dl);
  const notes = el('section'); notes.append(el('h3', null, 'Observations'));
  const ul = el('ul', 'notes');
  if (!(s.notes || []).length) ul.append(el('li', 'empty', 'None yet'));
  for (const n of [...(s.notes || [])].reverse()) { const li = el('li'); li.append(el('time', null, fmtTime(n.at)), document.createTextNode(n.text)); ul.append(li); }
  notes.append(ul);
  side.append(facts, notes);
  grid.append(stages, side);
  main.append(header, grid);
}

async function poll() {
  try {
    const r = await fetch('/api/releases', { cache: 'no-store' });
    if (r.ok) releases = await r.json();
    if (!selected && releases.length) selected = releases[0].id;
    renderList();
    if (selected) {
      const d = await fetch(`/api/releases/${encodeURIComponent(selected)}`, { cache: 'no-store' });
      if (d.ok) { current = await d.json(); renderRelease(current); }
    }
  } catch { /* keep the last rendering */ }
}
window.addEventListener('hashchange', () => { selected = decodeURIComponent(location.hash.slice(1)) || null; poll(); });
poll(); setInterval(poll, 3000); setInterval(() => current && current.outcome === 'in-progress' && renderRelease(current), 1000);
</script>
</body>
</html>
