<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7faf5" />
    <title>Mandarin journal</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/reading.css" />
    <link rel="stylesheet" href="/annotations.css" />
    <link rel="stylesheet" href="/scrapbook.css" />
    <link rel="stylesheet" href="/study.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="journal">
      <header class="masthead">
        <a class="brand" href="#home" aria-label="Mandarin journal home"
          ><span class="seal" lang="zh" aria-hidden="true">记</span>Mandarin journal</a
        >
        <nav aria-label="Journal">
          <a href="#home/words" id="tutor-attention" hidden>Tutor has a question</a>
          <a href="#saved" id="saved-link">List</a>
        </nav>
      </header>
      <div id="notice" class="notice" role="alert" hidden>
        <span id="error-message"></span><button id="retry">Retry</button>
      </div>
      <div id="layout" class="layout">
        <main id="content">
          <section data-page="home" class="scrapbook" id="scrapbook">
            <h1 class="sr">Your journal</h1>
            <div class="scrap-viewport" id="scrap-viewport">
              <div class="scrap-world" id="scrap-world" aria-label="Your scrapbook" role="region"></div>
            </div>
            <p class="board-empty" hidden>Your scrapbook is empty.</p>
            <div class="dock">
              <details class="dock-menu" id="dock-menu">
                <summary aria-label="Journal menu"><span class="seal" lang="zh" aria-hidden="true">记</span></summary>
                <nav class="dock-panel places" aria-label="Journal">
                  <a href="#read">Read</a>
                  <a href="#home/import">Import reading</a>
                  <a href="#chat">Talk</a>
                  <a href="#practice">Practice</a>
                  <a href="#saved">List</a>
                  <a id="archive-link" href="#saved/archive" hidden>Archive</a>
                  <a href="/operator/activity">Model activity</a>
                  <button type="button" data-zoom="fit">See everything</button>
                  <fieldset class="pictures-setting">
                    <legend>Pictures</legend>
                    <label><input type="radio" name="pictures" value="off" data-mutation />Off</label>
                    <label><input type="radio" name="pictures" value="quiet" data-mutation />Quiet</label>
                    <label><input type="radio" name="pictures" value="normal" data-mutation />Normal</label>
                  </fieldset>
                </nav>
              </details>
              <p class="today-line">
                <button type="button" id="dock-tutor" class="today-seal" aria-label="Tutor" aria-controls="tutor-body" aria-expanded="false"><span lang="zh" aria-hidden="true">师</span></button><span id="today-text"></span>
                <a id="today-action" class="today-go" href="#practice"></a>
              </p>
              <p class="dateline" id="today" hidden></p>
              <div id="recent" class="recent" hidden><a id="recent-link" href="#read"></a></div>
            </div>
            <dialog class="home-import-panel" id="home-import" aria-labelledby="home-import-title">
              <div class="home-import-head">
                <h2 id="home-import-title">Import reading</h2>
                <button class="home-import-close" id="close-import" type="button" aria-label="Close import">×</button>
              </div>
            </dialog>
            <section class="capture" aria-labelledby="word-heading">
              <h2 id="word-heading" class="sr">Drop something</h2>
              <p id="word-refresh-error" class="sub" hidden></p>
              <form id="word-form">
                <div class="intake-line">
                  <label for="word-text" class="sr">A word, a link, or a sentence</label>
                  <input id="word-text" maxlength="2048" required placeholder="A word, a link, a sentence…" autocomplete="off" />
                  <button class="primary" id="capture-submit" data-mutation>Send</button>
                </div>
                <details id="word-context-toggle" class="word-context">
                  <summary>Where you met it</summary>
                  <label for="word-context" class="sr">Where you saw or heard it</label>
                  <textarea id="word-context" maxlength="2000" rows="2" placeholder="A sentence, a place, a person…"></textarea>
                </details>
              </form>
            </section>
          </section>
          <section data-page="read" hidden class="page article"></section>
          <section data-page="chat" hidden class="page study-page">
            <h1>Conversation</h1>
            <div class="conversation-sheet">
              <div class="thread-tools">
                <label for="thread-picker">Topic</label>
                <select id="thread-picker" data-mutation></select>
                <button id="new-thread" data-mutation type="button" aria-expanded="false" aria-controls="thread-form">New conversation</button>
              </div>
              <form id="thread-form" class="thread-form" hidden>
                <label for="thread-title">New topic</label>
                <input id="thread-title" maxlength="100" required placeholder="周末的打算" />
                <button class="primary">Start</button><button type="button" id="cancel-thread">Cancel</button>
              </form>
              <div id="chat-messages" class="chat-messages">
                <div id="chat-history" class="turn-list" role="log" aria-label="Casual conversation"></div>
                <div id="chat-turn" class="turn-list" hidden></div>
              </div>
              <form id="chat-form">
                <label class="sr" for="chat-draft">Your message to your conversation partner</label>
                <textarea name="message" id="chat-draft" rows="2" required maxlength="1600" placeholder="写点什么……"></textarea>
                <div class="tools">
                  <button class="primary">Send</button><button id="reflect" type="button">Reflect with tutor</button>
                </div>
              </form>
            </div>
          </section>
          <section data-page="practice" hidden class="page study-page">
            <h1>Practice</h1>
            <div id="attempt-detail" class="practice-paper" hidden></div>
            <div id="active-practice">
              <div class="practice-topline">
                <label class="mode-label" for="practice-mode">Session
                  <select id="practice-mode">
                    <option>Daily mix</option>
                    <option>Past mistakes</option>
                  </select>
                </label>
                <div id="session-progress" class="session-progress" hidden>
                  <span id="session-time"></span>
                  <progress id="session-meter" aria-labelledby="session-time"></progress>
                </div>
              </div>
              <p id="session-notice" class="notice" role="status" hidden></p>
              <div id="practice-body" class="practice-paper"></div>
            </div>
          </section>
          <section data-page="saved" hidden class="page">
            <a class="back" href="#home">← Journal</a>
            <h1>Scrapbook</h1>
            <div id="saved-items" class="scrap-list"></div>
            <details id="board-archive" class="board-archive" hidden>
              <summary>Archived items</summary>
              <ul></ul>
            </details>
            <details id="activity-disclosure" class="activity-disclosure">
              <summary>Journal activity</summary>
              <ol id="activity-list"></ol>
            </details>
          </section>
        </main>
        <aside id="tutor" aria-label="Tutor">
          <button class="tutor-handle" id="tutor-toggle" type="button" aria-controls="tutor-body" aria-expanded="false" aria-label="Expand tutor">
            <span class="avatar" lang="zh" aria-hidden="true">师</span>
            <span>Tutor</span><span class="tuck-chevron" aria-hidden="true"></span>
          </button>
          <div class="tutor-fold"><div id="tutor-body" inert aria-hidden="true">
          <div id="tutor-messages" class="thread">
            <div id="tutor-history" class="turn-list" role="log" aria-label="Tutor conversation"></div>
            <div id="tutor-turn" class="turn-list" hidden></div>
          </div>
          <button type="button" id="tutor-point" class="tutor-point" aria-pressed="false" hidden>Point to something</button>
          <div id="tutor-context" class="tutor-context" hidden>
            <span id="tutor-context-label"></span>
            <button id="clear-context" type="button" aria-label="Remove source from question">×</button>
          </div>
          <form id="tutor-form" class="composer">
            <label for="tutor-draft" class="sr">Message tutor</label
            ><input
              id="tutor-draft"
              name="message"
              placeholder="Message tutor…"
              required
              maxlength="1600"
              autocomplete="off"
            /><button aria-label="Send message to tutor">↑</button>
          </form>
          </div></div>
        </aside>
      </div>
      <footer>
        <span class="runtime" id="runtime" role="status"></span>
      </footer>
      <p class="sr" id="pending" role="status" aria-live="polite"></p>
    </div>
    <dialog id="board-actions" class="board-dialog" aria-labelledby="board-action-title" aria-describedby="board-action-description">
      <h2 id="board-action-title"></h2>
      <p id="board-action-description"></p>
      <div class="board-buttons">
        <button id="board-archive-action" type="button" data-mutation>Archive</button>
        <button id="board-delete-action" type="button" data-mutation>Delete from scrapbook</button>
        <button id="board-cancel-action" type="button" autofocus>Cancel</button>
      </div>
    </dialog>
  </body>
</html>
